[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diatomic-ea"
version = "0.1.0.dev0"
description = "Fast and reproducible electron-affinity calculations for diatomic molecules"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "DiatomicEA contributors"}
]
dependencies = [
    "psutil>=5.9"
]

[project.optional-dependencies]
dev = [
    "pytest>=8"
]
compute = [
    "pyscf==2.13.0",
    "basis-set-exchange"
]

gui = [
    "PyQt5>=5.15.11,<6"
]

[project.scripts]
diatomic-ea = "diatomic_ea.cli:main"
diatomic-ea-gui = "diatomic_ea.gui:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

