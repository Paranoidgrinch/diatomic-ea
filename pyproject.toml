[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diatomic-ea"
version = "1.0.0rc1"
description = "Fast and reproducible electron-affinity calculations for diatomic molecules"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "DiatomicEA contributors"}
]
dependencies = [
    "psutil>=5.9"
]

license = "GPL-3.0-only"
license-files = ["LICENSE"]
[project.optional-dependencies]
dev = [
    "pytest>=8"
]
compute = [
    "pyscf==2.13.0",
    "basis-set-exchange"
]

gui = [
    "PyQt5>=5.15.11,<6"
]

[project.scripts]
diatomic-ea = "diatomic_ea.cli:main"
diatomic-ea-gui = "diatomic_ea.desktop_gui:main"

[project.urls]
Homepage = "https://github.com/Paranoidgrinch/diatomic-ea"
Repository = "https://github.com/Paranoidgrinch/diatomic-ea"
Issues = "https://github.com/Paranoidgrinch/diatomic-ea/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

